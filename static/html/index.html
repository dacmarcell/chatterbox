<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatterBox</title>
    <!-- We no longer strictly need Bootstrap since we wrote custom CSS, but we can keep it for normalization if we want, or just rely on our CSS -->
    <link href="/static/css/index.css" rel="stylesheet" />
  </head>
  <body>
    <div class="chat-container">
      <div class="chat-card">
        <div class="chat-header">
          <h2>ChatterBox</h2>
          <p>Online • ID: <span id="ws-id"></span></p>
        </div>
        <div class="chat-body" id="chatBody">
          <ul id="messages" class="message-list"></ul>
          <div
            class="error-message"
            id="errorMessage"
            style="display: none;"
          ></div>
        </div>
        <div class="chat-footer">
          <form
            class="send-message"
            action=""
            onsubmit="event.preventDefault(); sendMessage(event)"
          >
            <input
              type="text"
              id="messageText"
              placeholder="Type a message..."
              autocomplete="off"
            />
            <button type="submit" aria-label="Send">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-send"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
            </button>
          </form>
        </div>
      </div>
    </div>
    <script src="/static/js/main.js"></script>
  </body>
</html>
